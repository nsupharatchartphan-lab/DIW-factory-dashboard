<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แผนที่การกระจายตัวโรงงานทั่วประเทศ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #f3f1ec;
    --surface: #ffffff;
    --border: #e4e0d6;
    --text: #22281f;
    --text-muted: #767d6f;
    --primary: #b45309;
    --primary-dark: #92400e;
    --primary-soft: #fdf1e2;
    --radius: 14px;
    --shadow-sm: 0 1px 2px rgba(34, 40, 31, 0.07);
    --shadow-md: 0 12px 32px rgba(34, 40, 31, 0.14);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: 'Kanit', 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; }
  button, input, select { font-family: inherit; }

  #toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 16px;
    padding: 14px 22px;
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    font-size: 13px;
    position: relative;
    z-index: 10;
    flex: 0 0 auto;
  }
  #toolbar .group { display: flex; align-items: center; gap: 6px; }
  #toolbar label { white-space: nowrap; color: var(--text-muted); font-size: 13px; }

  #toolbar input[type="number"],
  #toolbar input[type="text"],
  #toolbar select {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 13px;
    color: var(--text);
    background: var(--surface);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  #toolbar input[type="number"]:focus,
  #toolbar input[type="text"]:focus,
  #toolbar select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-soft);
  }
  #toolbar input[type="number"] { width: 90px; }
  #search-input { width: 190px; }

  .clear-btn {
    border: none;
    background: none;
    color: var(--primary);
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
    transition: background .15s;
  }
  .clear-btn:hover { background: var(--primary-soft); }
  .clear-btn.small { font-size: 15px; padding: 2px 7px; color: var(--text-muted); }

  #view-toggle {
    display: inline-flex;
    background: var(--bg);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }
  #view-toggle button {
    padding: 6px 16px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    transition: background .15s, color .15s;
  }
  #view-toggle button.active { background: var(--primary); color: #fff; box-shadow: var(--shadow-sm); }

  /* === Searchable, scrollable factory-type dropdown === */
  .dropdown { position: relative; }
  .dropdown-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    min-width: 150px;
    justify-content: space-between;
  }
  .dropdown-btn:hover { border-color: var(--primary); }
  .dropdown-btn .chevron { color: var(--text-muted); font-size: 11px; }
  .dropdown-panel {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    width: 260px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    z-index: 2000;
    padding: 10px;
  }
  .dropdown-panel.hidden { display: none; }
  .dropdown-search-row { display: flex; align-items: center; gap: 4px; margin-bottom: 8px; }
  .dropdown-search-row input[type="text"] { flex: 1 1 auto; width: auto; }
  .type-options-list {
    max-height: 260px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .type-option-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    font-size: 13px;
    border-radius: 6px;
    cursor: pointer;
  }
  .type-option-row:hover { background: var(--bg); }
  .type-option-row[hidden] { display: none; }
  .type-option-row .count { color: var(--text-muted); font-size: 12px; }

  /* Fills whatever's left below the toolbar, however tall the toolbar
     ends up being (it can wrap onto several lines on a narrow phone
     screen) — a fixed calc(100vh - Npx) only worked for one fixed
     toolbar height. */
  #main-area { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  #app { display: flex; flex: 1 1 auto; min-height: 0; }
  #map { flex: 1 1 auto; }
  #sidebar {
    width: 350px;
    flex: 0 0 auto;
    overflow-y: auto;
    border-left: 1px solid var(--border);
    box-sizing: border-box;
    padding: 18px;
    background: var(--surface);
  }
  #sidebar h2 { font-size: 17px; margin: 0 0 8px; font-weight: 600; }
  #sidebar .hint { color: var(--text-muted); font-size: 13px; }
  #sidebar .back-btn {
    display: inline-flex;
    align-items: center;
    margin: 0 8px 14px 0;
    padding: 6px 14px;
    background: var(--primary-soft);
    color: var(--primary-dark);
    border-radius: 999px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    border: none;
    transition: background .15s;
  }
  #sidebar .back-btn:hover { background: #dbe8ff; }
  .tambon-group {
    margin-bottom: 14px;
    padding: 12px;
    background: var(--bg);
    border-radius: var(--radius);
    border: 1px solid var(--border);
  }
  .tambon-group + .tambon-group { border-top: 2px solid var(--primary-soft); }
  .tambon-group h3 { font-size: 13px; color: var(--text-muted); margin: 0 0 8px; font-weight: 600; }
  .factory-item {
    font-size: 13px;
    margin-bottom: 8px;
    padding-bottom: 8px;
    line-height: 1.4;
    border-bottom: 1px dashed var(--border);
  }
  .factory-item:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
  .factory-item .fname { color: var(--primary); cursor: pointer; font-weight: 600; }
  .factory-item .fname:hover { text-decoration: underline; }
  .factory-item .fbiz { color: var(--text-muted); }
  .factory-item .fhp { color: #94a0b0; font-size: 12px; }

  #detail-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(17, 24, 39, 0.5);
    backdrop-filter: blur(2px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  #detail-overlay.open { display: flex; }
  #detail-card {
    background: var(--surface);
    border-radius: 14px;
    max-width: 520px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
    padding: 24px 28px;
    position: relative;
    box-shadow: var(--shadow-md);
  }
  #detail-card h2 { margin-top: 0; font-size: 19px; font-weight: 600; }
  #detail-card .close-btn {
    position: absolute;
    top: 14px;
    right: 16px;
    cursor: pointer;
    font-size: 22px;
    color: var(--text-muted);
    border: none;
    background: none;
    line-height: 1;
    padding: 4px;
    border-radius: 6px;
  }
  #detail-card .close-btn:hover { background: var(--bg); }
  #detail-card dl { margin: 0; }
  #detail-card dt { font-size: 12px; color: var(--text-muted); margin-top: 12px; }
  #detail-card dd { margin: 2px 0 0; font-size: 14px; }
  .maps-link {
    display: inline-block;
    margin: 6px 0 2px;
    font-size: 13px;
    font-weight: 500;
    color: var(--primary);
    text-decoration: none;
  }
  .maps-link:hover { text-decoration: underline; }
  .maps-pin { margin-left: 5px; text-decoration: none; font-size: 12px; }

  #table-view { display: none; flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 20px; box-sizing: border-box; }
  .table-search-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .table-search-row input[type="text"] {
    width: 280px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 13px;
    background: var(--surface);
    outline: none;
  }
  .table-search-row input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  #table-view table {
    border-collapse: separate;
    border-spacing: 0;
    width: 100%;
    font-size: 13px;
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  #table-view th, #table-view td { padding: 9px 14px; text-align: left; border-bottom: 1px solid var(--border); }
  #table-view th { background: var(--bg); color: var(--text-muted); font-weight: 600; font-size: 12.5px; }
  #table-view tr.group-row { cursor: pointer; transition: background .1s; }
  #table-view tr.group-row:hover { background: var(--primary-soft); }
  #table-view .tambon-block { margin: 6px 0; padding: 10px 14px; background: var(--bg); border-radius: 8px; }
  #table-view .tambon-block h4 { font-size: 12px; color: var(--text-muted); margin: 0 0 6px; font-weight: 600; }
  #table-view .fname { color: var(--primary); cursor: pointer; font-weight: 500; }
  #table-view .fname:hover { text-decoration: underline; }

  /* === Overview / analysis tab === */
  #analysis-view { display: none; flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 20px; box-sizing: border-box; }
  .stat-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 16px 18px;
  }
  .stat-card .stat-value { font-size: 26px; font-weight: 700; color: var(--primary-dark); line-height: 1.2; }
  .stat-card .stat-label { font-size: 12.5px; color: var(--text-muted); margin-top: 4px; }
  .analysis-sections { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
  .bar-chart-card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 16px 18px;
    overflow-x: auto;
  }
  .bar-chart-card h3 { margin: 0 0 12px; font-size: 14px; font-weight: 600; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; font-size: 12.5px; }
  .bar-row .bar-label {
    width: 128px;
    flex: 0 0 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text);
  }
  .bar-row .bar-track { flex: 1 1 auto; background: var(--bg); border-radius: 4px; height: 14px; overflow: hidden; }
  .bar-row .bar-fill { height: 100%; border-radius: 4px; }
  .bar-row .bar-value { width: 46px; flex: 0 0 auto; text-align: right; color: var(--text-muted); font-size: 12px; }

  .region-summary-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .region-summary-table th, .region-summary-table td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--border); }
  .region-summary-table th:first-child, .region-summary-table td:first-child { text-align: left; }
  .region-summary-table th { color: var(--text-muted); font-weight: 600; font-size: 12px; }
  .region-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }

  .map-legend {
    background: var(--surface);
    padding: 10px 12px;
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    font-size: 12px;
    color: var(--text);
    line-height: 1.6;
    max-width: 260px;
  }
  .map-legend-title { font-weight: 600; margin-bottom: 6px; font-size: 12.5px; }
  .map-legend-row { display: flex; align-items: center; gap: 6px; }
  .map-legend-swatch {
    display: inline-block;
    width: 14px;
    height: 14px;
    border-radius: 3px;
    border: 1px solid rgba(0,0,0,0.1);
    flex: 0 0 auto;
  }
  .map-legend-region-row { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
  .map-legend-region-name { font-size: 11.5px; font-weight: 500; width: 108px; flex: 0 0 auto; }
  .map-legend-chips { display: flex; gap: 1px; border-radius: 3px; overflow: hidden; border: 1px solid rgba(0,0,0,0.1); }
  .map-legend-chip { width: 8px; height: 13px; display: inline-block; }
  .map-legend-region-max { font-size: 10.5px; color: var(--text-muted); white-space: nowrap; flex: 0 0 auto; }

  /* Permanent province/district name labels on the choropleth, used
     instead of a dot per polygon. */
  .leaflet-tooltip.map-label-tooltip {
    background: transparent;
    border: none;
    box-shadow: none;
    pointer-events: none;
    text-align: center;
    padding: 0;
  }
  .leaflet-tooltip.map-label-tooltip::before { display: none; }
  .map-label-name {
    font-weight: 600;
    font-size: 12px;
    color: #1c2a22;
    text-shadow: 0 1px 0 rgba(255,255,255,.75), 0 -1px 0 rgba(255,255,255,.75),
                 1px 0 0 rgba(255,255,255,.75), -1px 0 0 rgba(255,255,255,.75);
  }
  .map-label-count {
    font-size: 11px;
    font-weight: 500;
    color: #3d4a41;
    text-shadow: 0 1px 0 rgba(255,255,255,.75), 0 -1px 0 rgba(255,255,255,.75),
                 1px 0 0 rgba(255,255,255,.75), -1px 0 0 rgba(255,255,255,.75);
  }

  /* Draggable province-name label (country-wide view) — centered on
     its marker point via the transform below, since L.divIcon has no
     built-in centering for free-sized content. */
  .province-label-icon {
    transform: translate(-50%, -50%);
    text-align: center;
    cursor: grab;
    white-space: nowrap;
  }
  .province-label-icon:active { cursor: grabbing; }

  /* Phone/narrow-tablet layout: stack the sidebar below the map
     instead of beside it, let the toolbar wrap freely, and keep
     popovers from overflowing the viewport width. */
  @media (max-width: 768px) {
    #toolbar { padding: 8px 10px; gap: 8px; font-size: 12.5px; }
    #toolbar input[type="number"] { width: 72px; }
    #search-input { width: 140px; }
    #reset-labels-group { display: none; } /* labels aren't draggable on a phone */

    #app { flex-direction: column; }
    #map { flex: 1 1 auto; min-height: 280px; }

    /* Smaller choropleth labels — the full-size font that reads fine
       on a desktop-sized province polygon overruns a phone-sized one. */
    .map-label-name { font-size: 9.5px; }
    .map-label-count { font-size: 8.5px; }

    /* Bigger, easier-to-hit zoom buttons and a thicker polygon border
       so province/district shapes are easier to tap precisely. */
    .leaflet-control-zoom a { width: 38px; height: 38px; line-height: 38px; font-size: 18px; }
    .leaflet-touch .leaflet-bar a { width: 38px; height: 38px; line-height: 38px; }

    /* The sidebar only has a one-line hint at the country-wide view —
       collapse it there so the map gets most of the screen, and only
       expand once there's an actual factory list to show. */
    #sidebar {
      width: 100%;
      flex: 1 1 38%;
      max-height: 40vh;
      border-left: none;
      border-top: 1px solid var(--border);
      transition: max-height .15s ease;
    }
    #sidebar.sidebar-mini { flex: 0 0 auto; max-height: 52px; overflow: hidden; }

    .dropdown-panel { width: min(260px, 88vw); }
    #detail-card { padding: 20px 18px; }
    .map-legend { max-width: 190px; font-size: 11px; padding: 8px 10px; }
    .map-legend-region-name { width: 86px; }

    /* A bit more breathing room and slightly larger text in the
       sidebar/detail panels, which read as cramped at the default
       desktop sizing on a phone screen. */
    #sidebar { font-size: 14px; }
    #sidebar h2 { font-size: 18px; }
    .factory-item { font-size: 14px; margin-bottom: 12px; padding-bottom: 12px; }
    .factory-item .fhp { font-size: 13px; }
    .tambon-group { padding: 14px; }
    .tambon-group h3 { font-size: 14px; }
    #detail-card dt { font-size: 13px; }
    #detail-card dd { font-size: 15px; }

    .stat-cards { grid-template-columns: repeat(2, 1fr); }
    .stat-card .stat-value { font-size: 21px; }
    .bar-row .bar-label { width: 92px; font-size: 11.5px; }
    .region-summary-table { font-size: 11.5px; }
    .region-summary-table th, .region-summary-table td { padding: 6px 8px; }
    .table-search-row { flex-wrap: wrap; }
    .table-search-row input[type="text"] { width: 100%; }
  }
</style>
</head>
<body>
<div id="toolbar">
  <div class="group">
    <span id="view-toggle">
      <button id="view-map-btn" class="active" onclick="setView('map')">แผนที่</button>
      <button id="view-table-btn" onclick="setView('table')">ตาราง</button>
      <button id="view-analysis-btn" onclick="setView('analysis')">ภาพรวม</button>
    </span>
  </div>
  <div class="group">
    <label><input type="radio" name="hp-field" value="hp_registered" checked onchange="onFilterChange()"> แรงม้า</label>
    <label><input type="radio" name="hp-field" value="hp_inspected" onchange="onFilterChange()"> แรงม้าตรวจพบ</label>
  </div>
  <div class="group">
    <select id="hp-mode" onchange="onFilterChange(); updateHpModeUI();">
      <option value="range">ช่วง</option>
      <option value="gt">มากกว่า</option>
      <option value="lt">น้อยกว่า</option>
    </select>
    <span id="hp-range-inputs">
      <input type="number" id="hp-min" placeholder="ต่ำสุด" onchange="onFilterChange()">
      -
      <input type="number" id="hp-max" placeholder="สูงสุด" onchange="onFilterChange()">
    </span>
    <span id="hp-value-input" style="display:none">
      <input type="number" id="hp-value" placeholder="ค่า" onchange="onFilterChange()">
    </span>
    <button type="button" class="clear-btn" onclick="clearHp()">ล้างคำค้นหา</button>
  </div>
  <div class="group">
    <label>ประเภทโรงงาน:</label>
    <div class="dropdown">
      <button type="button" id="type-dropdown-btn" class="dropdown-btn" onclick="toggleTypeDropdown()">
        <span id="type-dropdown-summary">ทั้งหมด</span>
        <span class="chevron">&#9662;</span>
      </button>
      <div id="type-dropdown-panel" class="dropdown-panel hidden">
        <div class="dropdown-search-row">
          <input type="text" id="type-search" placeholder="ค้นหาประเภท..." oninput="filterTypeOptions()">
          <button type="button" class="clear-btn small" onclick="clearTypeSearch()">&times;</button>
        </div>
        <div id="type-options" class="type-options-list"></div>
      </div>
    </div>
  </div>
  <div class="group">
    <input type="text" id="search-input" placeholder="ค้นหาชื่อ/กิจการ" oninput="onFilterChange()">
    <button type="button" class="clear-btn" onclick="clearSearch()">ล้างคำค้นหา</button>
  </div>
  <div class="group" id="reset-labels-group">
    <button type="button" class="clear-btn" onclick="resetLabelOverrides()">รีเซ็ตตำแหน่งป้ายชื่อจังหวัด</button>
  </div>
</div>
<div id="main-area">
<div id="app">
  <div id="map"></div>
  <div id="sidebar">
    <div id="sidebar-content"><p class="hint">คลิกจังหวัดบนแผนที่เพื่อดูอำเภอ</p></div>
  </div>
</div>
<div id="table-view"></div>
<div id="analysis-view"></div>
</div>

<div id="detail-overlay">
  <div id="detail-card">
    <button class="close-btn" onclick="closeFactoryDetail()">&times;</button>
    <div id="detail-body"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const FACTORIES = /*__FACTORIES__*/ [];
const PROVINCES_GEOJSON = /*__PROVINCES_GEOJSON__*/ {"type":"FeatureCollection","features":[]};
const DISTRICTS_GEOJSON = /*__DISTRICTS_GEOJSON__*/ {"type":"FeatureCollection","features":[]};
const META = /*__META__*/ {"type_codes":[],"provinces":[],"regions":[],"hp_registered_max":0,"hp_inspected_max":0};
const SUBDISTRICT_CENTROIDS = /*__SUBDISTRICT_CENTROIDS__*/ [];
const SUBDISTRICTS_GEOJSON = /*__SUBDISTRICTS_GEOJSON__*/ {"type":"FeatureCollection","features":[]};
const REGIONS_GEOJSON = /*__REGIONS_GEOJSON__*/ {"type":"FeatureCollection","features":[]};

let currentLevel = 'province';
let currentProvince = null;
let currentDistrict = null;
let lastFactories = FACTORIES;
let currentView = 'map';
const expandedGroups = new Set();
let tableLocationSearch = '';

const map = L.map('map').setView([13.0, 101.0], 6);
let geoLayer = null;
let dotLayer = null;
let tambonBorderLayer = null;
let regionBoundaryLayer = null;
let labelLayer = null;

// Province name labels are draggable at the country-wide view — drag
// one wherever reads best, and the new spot is remembered (per
// browser, via localStorage) so it's still there next time this file
// is opened.
const LABEL_POSITIONS_KEY = 'diw_nationwide_label_positions_v1';

function loadLabelOverrides() {
  try {
    return JSON.parse(localStorage.getItem(LABEL_POSITIONS_KEY) || '{}');
  } catch (e) {
    return {};
  }
}

function saveLabelOverride(province, lat, lng) {
  try {
    const all = loadLabelOverrides();
    all[province] = [lat, lng];
    localStorage.setItem(LABEL_POSITIONS_KEY, JSON.stringify(all));
  } catch (e) {
    // localStorage unavailable (private window, blocked site data, …) —
    // dragging still works for this session, it just won't be remembered.
  }
}

function resetLabelOverrides() {
  try { localStorage.removeItem(LABEL_POSITIONS_KEY); } catch (e) {}
  renderMap(lastFactories);
}

function clearLabelLayer() {
  if (labelLayer) {
    map.removeLayer(labelLayer);
    labelLayer = null;
  }
}

// On a phone-sized screen labels aren't draggable and ignore any
// saved override — a label dragged on a desktop screen can easily
// land outside a province's much smaller on-screen shape at a phone's
// typical zoom, and a touch-drag on the label itself fights with
// panning the map underneath it.
function isMobileLayout() {
  return window.matchMedia('(max-width: 768px)').matches;
}

function addDraggableProvinceLabel(province, count, defaultLatLng) {
  const mobile = isMobileLayout();
  const overrides = mobile ? {} : loadLabelOverrides();
  const saved = overrides[province];
  const latlng = saved ? L.latLng(saved[0], saved[1]) : defaultLatLng;
  const icon = L.divIcon({
    className: 'province-label-icon',
    html: `<div class="map-label-name">${escapeHtml(province)}</div><div class="map-label-count">${count}</div>`,
    iconSize: [0, 0],
  });
  const marker = L.marker(latlng, { icon, draggable: !mobile, keyboard: false });
  if (!mobile) {
    marker.on('dragend', () => {
      const pos = marker.getLatLng();
      saveLabelOverride(province, pos.lat, pos.lng);
    });
  }
  labelLayer.addLayer(marker);
}

function clearRegionBoundaryLayer() {
  if (regionBoundaryLayer) {
    map.removeLayer(regionBoundaryLayer);
    regionBoundaryLayer = null;
  }
}

// A thick, non-interactive outline around each region's combined area
// (merged from its provinces), drawn in that region's own deep tone —
// only shown at the country-wide province view, where it frames which
// provinces belong to which region.
function renderRegionBoundaries() {
  clearRegionBoundaryLayer();
  regionBoundaryLayer = L.geoJSON(REGIONS_GEOJSON, {
    interactive: false,
    style: feature => {
      const colors = REGION_COLOR_SCALE_10[feature.properties.region] || REGION_COLOR_SCALE_10['กลาง'];
      return { fillOpacity: 0, weight: 3, color: colors[8], dashArray: null };
    },
  }).addTo(map);
}

function dotRadius(count) {
  if (count <= 0) return 0;
  return Math.min(3 + Math.sqrt(count) * 1.1, 14);
}

function clearDotLayer() {
  if (dotLayer) {
    map.removeLayer(dotLayer);
    dotLayer = null;
  }
}

function clearTambonBorderLayer() {
  if (tambonBorderLayer) {
    map.removeLayer(tambonBorderLayer);
    tambonBorderLayer = null;
  }
}

function addDot(lat, lon, count, label, color) {
  if (count <= 0 || lat === undefined || lon === undefined) return;
  const marker = L.circleMarker([lat, lon], {
    radius: dotRadius(count),
    color: '#1b2430',
    weight: 1,
    fillColor: color,
    fillOpacity: 0.85,
    interactive: false,
  });
  dotLayer.addLayer(marker);
}

function renderDots(factories) {
  clearDotLayer();
  clearTambonBorderLayer();
  dotLayer = L.layerGroup().addTo(map);

  if (currentLevel === 'district' && currentProvince && currentDistrict) {
    const region = regionOf(currentProvince);
    const inDistrict = factories.filter(
      f => f.province === currentProvince && f.amphoe === currentDistrict
    );
    const countByTambon = {};
    for (const f of inDistrict) {
      const key = f.tambon || '';
      countByTambon[key] = (countByTambon[key] || 0) + 1;
    }
    const tambonsHere = SUBDISTRICT_CENTROIDS.filter(
      c => c.province === currentProvince && c.amphoe === currentDistrict
    );
    const maxCount = Math.max(0, ...tambonsHere.map(c => countByTambon[c.tambon] || 0));
    const scale = makeColorScale(maxCount, region);

    const tambonFeatures = {
      type: 'FeatureCollection',
      features: SUBDISTRICTS_GEOJSON.features.filter(
        f => f.properties.pro_th === currentProvince && f.properties.amp_th === currentDistrict
      ),
    };
    tambonBorderLayer = L.geoJSON(tambonFeatures, {
      style: feature => {
        const count = countByTambon[feature.properties.tam_th] || 0;
        return { fillColor: scale.colorFor(count), fillOpacity: 0.3, weight: 1.5, color: '#555', dashArray: '4,3' };
      },
      onEachFeature: (feature, layer) => {
        const count = countByTambon[feature.properties.tam_th] || 0;
        layer.bindTooltip(`${feature.properties.tam_th}: ${count} โรงงาน`);
        layer.on('click', () => scrollSidebarToTambon(feature.properties.tam_th));
      },
    }).addTo(map);

    for (const centroid of tambonsHere) {
      const count = countByTambon[centroid.tambon] || 0;
      addDot(centroid.lat, centroid.lon, count, centroid.tambon, scale.colorFor(count));
    }
    updateLegend(`ตำบล: จำนวนโรงงาน (${REGION_LABELS[region]})`, scale);
  }
}

// === Dynamic, per-region color scale ===
// Each region (เหนือ/กลาง/ตะวันออก/ตะวันออกเฉียงเหนือ/ใต้) keeps its own
// single-tone gradient so the whole country can be told apart by region
// at a glance, while the shade within a region still encodes the factory
// count exactly as the north-only dashboard's single amber scale did.
// A factory's type (fertiliser plants included) never affects its color —
// only the province/district/tambon it's in does — so filtering down to
// one factory type keeps the same region tones, just with fewer counts.
// Pastel 10-step ramps — softer, lower-saturation tones throughout
// so the whole country reads as pastel rather than saturated single
// tones. กรุงเทพมหานคร is its own region/tone, separate from the
// rest of the central provinces.
const REGION_COLOR_SCALE_10 = {
  'เหนือ': ['#fff6ec', '#fde9d2', '#fbdab3', '#f7c896', '#f2b67c',
            '#eba366', '#e08f57', '#cf7a4a', '#b5663d', '#8f4f30'],
  'กลาง': ['#f1f4fb', '#dfe6f6', '#c7d4ef', '#abc0e6', '#8facdb',
           '#7398cf', '#5d84c0', '#4c71ac', '#3e5e92', '#314b75'],
  'กทม.': ['#f6f6f5', '#eae9e7', '#dad9d6', '#c6c4c0', '#b1afaa',
           '#9c9994', '#86837d', '#706d68', '#595652', '#423f3c'],
  'ตะวันออก': ['#f6f0fb', '#e9dcf5', '#dac5ee', '#c7a9e3', '#b38dd7',
               '#9f72ca', '#8a5cb8', '#73499c', '#5c3a7d', '#462c60'],
  'ตะวันออกเฉียงเหนือ': ['#f0faf1', '#dcf3e0', '#c2e9c9', '#a3deac', '#85d190',
                         '#68c078', '#52a863', '#3f8c50', '#2f6f3e', '#22542f'],
  'ใต้': ['#fff1ee', '#ffe0d8', '#ffcabb', '#ffb29d', '#fb9982',
          '#f0806a', '#de6a56', '#c25646', '#9f4539', '#7a362c'],
};
const REGION_ORDER = ['เหนือ', 'กลาง', 'กทม.', 'ตะวันออก', 'ตะวันออกเฉียงเหนือ', 'ใต้'];
const REGION_LABELS = {
  'เหนือ': 'ภาคเหนือ', 'กลาง': 'ภาคกลาง', 'กทม.': 'กรุงเทพมหานคร', 'ตะวันออก': 'ภาคตะวันออก',
  'ตะวันออกเฉียงเหนือ': 'ภาคตะวันออกเฉียงเหนือ', 'ใต้': 'ภาคใต้',
};

const PROVINCE_REGION = {};
for (const f of PROVINCES_GEOJSON.features) {
  PROVINCE_REGION[f.properties.pro_th] = f.properties.region;
}
function regionOf(province) {
  return PROVINCE_REGION[province] || 'กลาง';
}

// Rounds up to 2 significant figures: 1062 -> 1100, 141 -> 150,
// 80 -> 80. Matches how a person would round a count up by eye.
function roundUpToNice(max) {
  if (max <= 0) return 1;
  const digits = Math.floor(Math.log10(max)) + 1;
  const place = Math.pow(10, Math.max(digits - 2, 0));
  return Math.ceil(max / place) * place;
}

// Splits [0, roundedMax] into 10 equal-width bins (10% of the rounded
// maximum each) and maps each bin to one step of the given region's
// color ramp.
function makeColorScale(max, region) {
  const roundedMax = roundUpToNice(max);
  const step = roundedMax / 10;
  const colors = REGION_COLOR_SCALE_10[region] || REGION_COLOR_SCALE_10['กลาง'];
  return {
    roundedMax,
    step,
    region,
    colors,
    colorFor(count) {
      // Zero factories always renders plain white, whatever region
      // the province/district/tambon belongs to — only an area with
      // at least one factory gets its region's tone.
      if (count <= 0) return '#ffffff';
      const idx = Math.min(Math.ceil(count / step) - 1, 9);
      return colors[Math.max(idx, 0)];
    },
  };
}

function bindMapLabel(layer, name, count) {
  layer.bindTooltip(
    `<div class="map-label-name">${escapeHtml(name)}</div><div class="map-label-count">${count}</div>`,
    { permanent: true, direction: 'center', className: 'map-label-tooltip', opacity: 1 }
  );
}

function countForProvince(factories, province) {
  return factories.filter(f => f.province === province).length;
}

function countForDistrict(factories, province, amphoe) {
  return factories.filter(f => f.province === province && f.amphoe === amphoe).length;
}

function clearGeoLayer() {
  if (geoLayer) {
    map.removeLayer(geoLayer);
    geoLayer = null;
  }
}

function renderProvinceLevel(factories) {
  clearGeoLayer();
  clearLabelLayer();
  labelLayer = L.layerGroup().addTo(map);
  const regionsPresent = [...new Set(PROVINCES_GEOJSON.features.map(f => f.properties.region))];
  const scalesByRegion = {};
  for (const region of regionsPresent) {
    const provincesInRegion = PROVINCES_GEOJSON.features.filter(f => f.properties.region === region);
    const maxCount = Math.max(0, ...provincesInRegion.map(f => countForProvince(factories, f.properties.pro_th)));
    scalesByRegion[region] = makeColorScale(maxCount, region);
  }
  geoLayer = L.geoJSON(PROVINCES_GEOJSON, {
    style: feature => {
      const count = countForProvince(factories, feature.properties.pro_th);
      const scale = scalesByRegion[feature.properties.region];
      return { fillColor: scale.colorFor(count), weight: 1, color: '#555', fillOpacity: 0.75 };
    },
    onEachFeature: (feature, layer) => {
      const count = countForProvince(factories, feature.properties.pro_th);
      addDraggableProvinceLabel(feature.properties.pro_th, count, layer.getBounds().getCenter());
      layer.on('click', () => {
        currentLevel = 'district';
        currentProvince = feature.properties.pro_th;
        currentDistrict = null;
        renderMap(factories);
        map.fitBounds(layer.getBounds());
      });
    }
  }).addTo(map);
  if (geoLayer.getBounds().isValid()) {
    map.fitBounds(geoLayer.getBounds());
  }
  renderRegionBoundaries();
  updateLegendRegions('จังหวัด: จำนวนโรงงาน (แบ่งสีตามภาค)', scalesByRegion);
  renderDots(factories);
  renderSidebar(factories);
}

function renderDistrictLevel(factories) {
  clearGeoLayer();
  clearRegionBoundaryLayer();
  clearLabelLayer();

  if (currentDistrict) {
    // A district has been picked: show only that one polygon, as a
    // plain backdrop frame — the tambon boundary/dot layer (added by
    // renderDots below) carries the actual data at this zoom level,
    // and the neighboring districts are removed rather than just
    // staying colored around it.
    const selected = DISTRICTS_GEOJSON.features.find(
      f => f.properties.pro_th === currentProvince && f.properties.amp_th === currentDistrict
    );
    if (selected) {
      geoLayer = L.geoJSON(selected, {
        style: { fillColor: 'transparent', weight: 2, color: '#555', fillOpacity: 0 },
      }).addTo(map);
      if (geoLayer.getBounds().isValid()) {
        map.fitBounds(geoLayer.getBounds());
      }
    }
    renderDots(factories);
    renderSidebar(factories);
    return;
  }

  const region = regionOf(currentProvince);
  const districtFeatures = {
    type: 'FeatureCollection',
    features: DISTRICTS_GEOJSON.features.filter(f => f.properties.pro_th === currentProvince)
  };
  const maxCount = Math.max(0, ...districtFeatures.features.map(
    f => countForDistrict(factories, f.properties.pro_th, f.properties.amp_th)
  ));
  const scale = makeColorScale(maxCount, region);
  geoLayer = L.geoJSON(districtFeatures, {
    style: feature => {
      const count = countForDistrict(factories, feature.properties.pro_th, feature.properties.amp_th);
      return { fillColor: scale.colorFor(count), weight: 1, color: '#555', fillOpacity: 0.75 };
    },
    onEachFeature: (feature, layer) => {
      const count = countForDistrict(factories, feature.properties.pro_th, feature.properties.amp_th);
      bindMapLabel(layer, feature.properties.amp_th, count);
      layer.on('click', () => {
        currentDistrict = feature.properties.amp_th;
        renderDistrictLevel(factories);
      });
    }
  }).addTo(map);
  if (geoLayer.getBounds().isValid()) {
    map.fitBounds(geoLayer.getBounds());
  }
  updateLegend(`อำเภอ: จำนวนโรงงาน (${REGION_LABELS[region]})`, scale);
  renderDots(factories);
  renderSidebar(factories);
}

function renderMap(factories) {
  lastFactories = factories;
  if (currentLevel === 'district' && currentProvince) {
    renderDistrictLevel(factories);
  } else {
    currentLevel = 'province';
    currentProvince = null;
    currentDistrict = null;
    renderProvinceLevel(factories);
  }
}

function backToProvinceView() {
  currentLevel = 'province';
  currentProvince = null;
  currentDistrict = null;
  renderMap(lastFactories);
}

function backToDistrictView() {
  currentDistrict = null;
  renderDistrictLevel(lastFactories);
}

function escapeHtml(value) {
  if (value === null || value === undefined) return '';
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function renderSidebar(factories) {
  const el = document.getElementById('sidebar-content');
  // On a phone, the sidebar only shows a one-line hint at the
  // country-wide view — collapse it there so the map keeps most of
  // the screen, expanding again once there's an actual list to show.
  document.getElementById('sidebar').classList.toggle('sidebar-mini', currentLevel === 'province');

  if (currentLevel === 'province') {
    el.innerHTML = '<p class="hint">คลิกจังหวัดบนแผนที่เพื่อดูอำเภอ</p>';
    return;
  }

  if (!currentDistrict) {
    el.innerHTML =
      `<button class="back-btn" onclick="backToProvinceView()">&larr; กลับไปมุมมองจังหวัด</button>` +
      `<h2>${escapeHtml(currentProvince)}</h2>` +
      `<p class="hint">คลิกอำเภอบนแผนที่เพื่อดูรายชื่อโรงงาน</p>`;
    return;
  }

  const matching = factories.filter(
    f => f.province === currentProvince && f.amphoe === currentDistrict
  );
  const byTambon = {};
  for (const f of matching) {
    const key = f.tambon || 'ไม่ระบุตำบล';
    if (!byTambon[key]) byTambon[key] = [];
    byTambon[key].push(f);
  }

  let html =
    `<button class="back-btn" onclick="backToProvinceView()">&larr; กลับไปมุมมองจังหวัด</button>` +
    `<button class="back-btn" onclick="backToDistrictView()">&larr; กลับไปมุมมองอำเภอ</button>` +
    `<h2>${escapeHtml(currentProvince)} / ${escapeHtml(currentDistrict)}</h2>` +
    `<p class="hint">${matching.length} โรงงาน</p>`;

  for (const tambon of Object.keys(byTambon).sort()) {
    html += `<div class="tambon-group" data-tambon="${escapeHtml(tambon)}"><h3>ต.${escapeHtml(tambon)}</h3>`;
    for (const f of byTambon[tambon]) {
      const mapsUrl = googleMapsUrl(f);
      html +=
        `<div class="factory-item">` +
        `<span class="fname" onclick="showFactoryDetail(${f.fid})">${escapeHtml(f.name)}</span>` +
        (mapsUrl ? `<a class="maps-pin" href="${mapsUrl}" target="_blank" rel="noopener" title="เปิดใน Google Maps">&#128205;</a>` : '') +
        `<br>` +
        `<span class="fbiz">${escapeHtml(f.business)}</span><br>` +
        `<span class="fhp">แรงม้า: ${escapeHtml(f.hp_registered)}</span>` +
        `</div>`;
    }
    html += `</div>`;
  }

  el.innerHTML = html;
}

// Clicking a tambon's shape on the map scrolls the sidebar's list up
// to that tambon's section, since the full list for a district can run
// well below the fold.
function scrollSidebarToTambon(tambon) {
  const el = document.querySelector(`.tambon-group[data-tambon="${CSS.escape(tambon)}"]`);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

const DETAIL_FIELDS = [
  ['operator', 'ผู้ประกอบการ'],
  ['business', 'ประกอบกิจการ'],
  ['address_no', 'เลขที่'],
  ['moo', 'หมู่'],
  ['soi', 'ซอย'],
  ['road', 'ถนน'],
  ['tambon', 'ตำบล'],
  ['amphoe', 'อำเภอ'],
  ['province', 'จังหวัด'],
  ['region', 'ภาค'],
  ['postcode', 'ไปรษณีย์'],
  ['phone', 'โทรศัพท์'],
  ['old_reg_no', 'เลขทะเบียนเดิม'],
  ['hp_registered', 'แรงม้า'],
  ['hp_inspected', 'แรงม้าตรวจพบ'],
  ['capital_total', 'เงินทุนรวม'],
  ['workers_total', 'จำนวนคนงาน'],
  ['factory_area', 'พื้นที่โรงงาน'],
  ['building_area', 'พื้นที่อาคาร'],
  ['production', 'กำลังผลิต'],
  ['type_code', 'ประเภทโรงงาน'],
  ['commercial_reg', 'ทะเบียนพาณิชย์'],
  ['tax_id', 'เลขผู้เสียภาษี'],
];

function googleMapsUrl(factory) {
  if (factory.gps_lat == null || factory.gps_lng == null) return null;
  return `https://www.google.com/maps?q=${factory.gps_lat},${factory.gps_lng}`;
}

function showFactoryDetail(fid) {
  const factory = FACTORIES.find(f => f.fid === fid);
  if (!factory) return;

  let html = `<h2>${escapeHtml(factory.name)}</h2>`;
  const mapsUrl = googleMapsUrl(factory);
  if (mapsUrl) {
    html += `<a class="maps-link" href="${mapsUrl}" target="_blank" rel="noopener">เปิดตำแหน่งใน Google Maps &#8599;</a>`;
  }
  html += `<dl>`;
  for (const [key, label] of DETAIL_FIELDS) {
    let value;
    if (key === 'production') {
      value = factory.production_capacity != null
        ? `${factory.production_capacity.toLocaleString('th-TH')}${factory.production_unit ? ' ' + factory.production_unit : ''}`
        : '-';
    } else if (key === 'capital_total' && factory.capital_total != null) {
      value = `${factory.capital_total.toLocaleString('th-TH')} บาท`;
    } else if (key === 'workers_total' && factory.workers_total != null) {
      value = `${factory.workers_total.toLocaleString('th-TH')} คน`;
    } else if ((key === 'factory_area' || key === 'building_area') && factory[key] != null) {
      value = `${factory[key].toLocaleString('th-TH')} ตร.ม.`;
    } else {
      value = factory[key] ?? '-';
      if (key === 'region' && REGION_LABELS[value]) value = REGION_LABELS[value];
    }
    html += `<dt>${label}</dt><dd>${escapeHtml(value)}</dd>`;
  }
  html += `</dl>`;

  document.getElementById('detail-body').innerHTML = html;
  document.getElementById('detail-overlay').classList.add('open');
}

function closeFactoryDetail() {
  document.getElementById('detail-overlay').classList.remove('open');
}

document.getElementById('detail-overlay').addEventListener('click', e => {
  if (e.target.id === 'detail-overlay') closeFactoryDetail();
});

const selectedTypeCodes = new Set();

// "10(3)" -> [10, 3], "105" -> [105, 0] — sorts the dropdown by the
// factory type's actual number, not by how common it is.
function parseTypeCodeForSort(code) {
  const match = code.match(/^(\d+)(?:\((\d+)\))?/);
  if (!match) return [Number.MAX_SAFE_INTEGER, 0];
  return [parseInt(match[1], 10), match[2] ? parseInt(match[2], 10) : 0];
}

function populateTypeFilter() {
  const container = document.getElementById('type-options');
  const sortedTypeCodes = [...META.type_codes].sort((a, b) => {
    const [aMain, aSub] = parseTypeCodeForSort(a.code);
    const [bMain, bSub] = parseTypeCodeForSort(b.code);
    return aMain - bMain || aSub - bSub;
  });
  for (const { code, count } of sortedTypeCodes) {
    const row = document.createElement('label');
    row.className = 'type-option-row';
    row.dataset.code = code.toLowerCase();
    row.innerHTML =
      `<input type="checkbox" value="${escapeHtml(code)}" onchange="onTypeCheckboxChange(this)">` +
      `<span>${escapeHtml(code)} <span class="count">(${count})</span></span>`;
    container.appendChild(row);
  }
}

function onTypeCheckboxChange(checkbox) {
  if (checkbox.checked) {
    selectedTypeCodes.add(checkbox.value);
  } else {
    selectedTypeCodes.delete(checkbox.value);
  }
  updateTypeDropdownSummary();
  onFilterChange();
}

function updateTypeDropdownSummary() {
  document.getElementById('type-dropdown-summary').textContent =
    selectedTypeCodes.size === 0 ? 'ทั้งหมด' : `เลือก ${selectedTypeCodes.size} ประเภท`;
}

function filterTypeOptions() {
  const search = document.getElementById('type-search').value.trim().toLowerCase();
  for (const row of document.querySelectorAll('.type-option-row')) {
    row.hidden = search !== '' && !row.dataset.code.includes(search);
  }
}

function clearTypeSearch() {
  document.getElementById('type-search').value = '';
  filterTypeOptions();
}

function toggleTypeDropdown() {
  document.getElementById('type-dropdown-panel').classList.toggle('hidden');
}

document.addEventListener('click', e => {
  const panel = document.getElementById('type-dropdown-panel');
  const btn = document.getElementById('type-dropdown-btn');
  if (!panel.contains(e.target) && !btn.contains(e.target)) {
    panel.classList.add('hidden');
  }
});

function clearSearch() {
  document.getElementById('search-input').value = '';
  onFilterChange();
}

function clearHp() {
  document.getElementById('hp-min').value = '';
  document.getElementById('hp-max').value = '';
  document.getElementById('hp-value').value = '';
  onFilterChange();
}

// Keep the map's view stable (same geographic center) whenever its
// container changes size — window resize, minimize/restore, or the
// sidebar/toolbar reflowing the layout.
new ResizeObserver(() => map.invalidateSize()).observe(document.getElementById('map'));
window.addEventListener('resize', () => map.invalidateSize());

// === Choropleth color-bar legend ===
let legendDiv = null;
const colorLegend = L.control({ position: 'bottomright' });
colorLegend.onAdd = function () {
  legendDiv = L.DomUtil.create('div', 'map-legend');
  return legendDiv;
};
colorLegend.addTo(map);

// Single-region legend (district/tambon levels, where everything on
// screen belongs to one region already).
function updateLegend(title, scale) {
  if (!legendDiv) return;
  const isWhole = Number.isInteger(scale.step);
  const fmt = v => (isWhole ? Math.round(v) : Math.round(v * 10) / 10);
  let html = `<div class="map-legend-title">${escapeHtml(title)}</div>`;
  html += `<div class="map-legend-row"><span class="map-legend-swatch" style="background:#ffffff"></span>ไม่มีโรงงาน</div>`;
  for (let i = 0; i < 10; i++) {
    const lo = fmt(i * scale.step);
    const hi = fmt((i + 1) * scale.step);
    const label = i === 9 ? `${lo}+` : `${lo}–${hi}`;
    html += `<div class="map-legend-row"><span class="map-legend-swatch" style="background:${scale.colors[i]}"></span>${label}</div>`;
  }
  legendDiv.innerHTML = html;
}

// Multi-region legend (country-wide province level) — one compact row
// per region: its name, a 10-step gradient strip, and its 0–max range.
function updateLegendRegions(title, scalesByRegion) {
  if (!legendDiv) return;
  let html = `<div class="map-legend-title">${escapeHtml(title)}</div>`;
  html += `<div class="map-legend-row"><span class="map-legend-swatch" style="background:#ffffff"></span>ไม่มีโรงงาน</div>`;
  for (const region of REGION_ORDER) {
    const scale = scalesByRegion[region];
    if (!scale) continue;
    const isWhole = Number.isInteger(scale.step);
    const fmtMax = isWhole ? Math.round(scale.roundedMax) : Math.round(scale.roundedMax * 10) / 10;
    let chips = '';
    for (let i = 0; i < 10; i++) {
      chips += `<span class="map-legend-chip" style="background:${scale.colors[i]}"></span>`;
    }
    html += `<div class="map-legend-region-row">` +
      `<div class="map-legend-region-name">${escapeHtml(REGION_LABELS[region])}</div>` +
      `<div class="map-legend-chips">${chips}</div>` +
      `<div class="map-legend-region-max">0–${fmtMax}</div>` +
      `</div>`;
  }
  legendDiv.innerHTML = html;
}

function updateHpModeUI() {
  const mode = document.getElementById('hp-mode').value;
  document.getElementById('hp-range-inputs').style.display = mode === 'range' ? '' : 'none';
  document.getElementById('hp-value-input').style.display = mode === 'range' ? 'none' : '';
}

function getFilteredFactories() {
  const hpField = document.querySelector('input[name="hp-field"]:checked').value;
  const hpMode = document.getElementById('hp-mode').value;
  const hpMin = document.getElementById('hp-min').value;
  const hpMax = document.getElementById('hp-max').value;
  const hpValue = document.getElementById('hp-value').value;
  const selectedTypes = Array.from(selectedTypeCodes);
  const searchText = document.getElementById('search-input').value.trim().toLowerCase();

  return FACTORIES.filter(f => {
    const hp = f[hpField];

    if (hpMode === 'range') {
      if (hpMin !== '' && (hp === null || hp < parseFloat(hpMin))) return false;
      if (hpMax !== '' && (hp === null || hp > parseFloat(hpMax))) return false;
    } else if (hpMode === 'gt') {
      if (hpValue !== '' && (hp === null || !(hp > parseFloat(hpValue)))) return false;
    } else if (hpMode === 'lt') {
      if (hpValue !== '' && (hp === null || !(hp < parseFloat(hpValue)))) return false;
    }

    if (selectedTypes.length > 0 && !selectedTypes.includes(f.type_code)) return false;

    if (searchText) {
      const haystack = (f.name + ' ' + f.business).toLowerCase();
      if (!haystack.includes(searchText)) return false;
    }

    return true;
  });
}

function onFilterChange() {
  const filtered = getFilteredFactories();
  renderMap(filtered);
  if (currentView === 'table') renderTable(filtered);
  if (currentView === 'analysis') renderAnalysis(filtered);
}

function setView(view) {
  currentView = view;
  document.getElementById('view-map-btn').classList.toggle('active', view === 'map');
  document.getElementById('view-table-btn').classList.toggle('active', view === 'table');
  document.getElementById('view-analysis-btn').classList.toggle('active', view === 'analysis');
  document.getElementById('app').style.display = view === 'map' ? 'flex' : 'none';
  document.getElementById('table-view').style.display = view === 'table' ? 'block' : 'none';
  document.getElementById('analysis-view').style.display = view === 'analysis' ? 'block' : 'none';
  if (view === 'table') renderTable(getFilteredFactories());
  if (view === 'analysis') renderAnalysis(getFilteredFactories());
}

// === Overview / analysis tab ===
// A quick statistical summary of whatever's currently filtered — same
// FACTORIES-derived counts the map and table use, just rolled up into
// headline numbers and ranked bar lists instead of a choropleth.
function countBy(factories, keyFn) {
  const counts = {};
  for (const f of factories) {
    const key = keyFn(f);
    if (key === null || key === undefined || key === '') continue;
    counts[key] = (counts[key] || 0) + 1;
  }
  return counts;
}

function topEntries(counts, limit) {
  return Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, limit);
}

function renderBarChartCard(title, entries, colorFor) {
  const max = Math.max(1, ...entries.map(([, count]) => count));
  let html = `<div class="bar-chart-card"><h3>${escapeHtml(title)}</h3>`;
  if (entries.length === 0) {
    html += `<p class="hint">ไม่มีข้อมูล</p>`;
  }
  for (const [label, count] of entries) {
    const pct = Math.round((count / max) * 100);
    html += `<div class="bar-row">` +
      `<div class="bar-label" title="${escapeHtml(label)}">${escapeHtml(label)}</div>` +
      `<div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${colorFor(label)}"></div></div>` +
      `<div class="bar-value">${count.toLocaleString('th-TH')}</div>` +
      `</div>`;
  }
  html += `</div>`;
  return html;
}

// Horsepower buckets for the size-distribution chart — rough small/
// medium/large bands rather than a fixed bin width, since factory
// horsepower spans a couple of orders of magnitude.
const HP_BUCKETS = [
  [0, 50, '<50'],
  [50, 200, '50–200'],
  [200, 500, '200–500'],
  [500, 1000, '500–1,000'],
  [1000, Infinity, '1,000+'],
];

function regionColorFor(region) {
  return (REGION_COLOR_SCALE_10[region] || REGION_COLOR_SCALE_10['กลาง'])[7];
}

function renderAnalysis(factories) {
  const el = document.getElementById('analysis-view');

  const totalCount = factories.length;
  let totalHp = 0, totalCapital = 0, totalWorkers = 0;
  let countWithHp = 0, countWithCapital = 0, countWithGps = 0, countNeverInspected = 0;
  for (const f of factories) {
    if (typeof f.hp_registered === 'number') { totalHp += f.hp_registered; countWithHp++; }
    if (typeof f.capital_total === 'number') { totalCapital += f.capital_total; countWithCapital++; }
    if (typeof f.workers_total === 'number') totalWorkers += f.workers_total;
    if (f.gps_lat != null && f.gps_lng != null) countWithGps++;
    if (!f.hp_inspected) countNeverInspected++;
  }
  const provinceCounts = countBy(factories, f => f.province);
  const provincesRepresented = Object.keys(provinceCounts).length;
  const pct = (n, d) => d > 0 ? Math.round((n / d) * 100) : 0;

  const statCards = [
    [totalCount.toLocaleString('th-TH'), 'จำนวนโรงงาน (ตามตัวกรองปัจจุบัน)'],
    [totalHp.toLocaleString('th-TH'), 'แรงม้ารวม'],
    [(totalCapital / 1e6).toLocaleString('th-TH', { maximumFractionDigits: 1 }) + ' ล้านบาท', 'เงินทุนรวม'],
    [totalWorkers.toLocaleString('th-TH'), 'จำนวนคนงานรวม'],
    [provincesRepresented.toLocaleString('th-TH'), 'จังหวัดที่มีโรงงาน (จาก 77)'],
    [countWithHp ? Math.round(totalHp / countWithHp).toLocaleString('th-TH') : '-', 'แรงม้าเฉลี่ย/โรงงาน'],
    [countWithCapital ? Math.round(totalCapital / countWithCapital / 1e3).toLocaleString('th-TH') + ' พันบาท' : '-', 'เงินทุนเฉลี่ย/โรงงาน'],
    [`${pct(countWithGps, totalCount)}%`, 'มีพิกัด GPS'],
    [`${pct(countNeverInspected, totalCount)}%`, 'ยังไม่มีค่าแรงม้าตรวจพบ'],
  ];

  let html = '<div class="stat-cards">';
  for (const [value, label] of statCards) {
    html += `<div class="stat-card"><div class="stat-value">${value}</div><div class="stat-label">${escapeHtml(label)}</div></div>`;
  }
  html += '</div>';

  const typeCounts = countBy(factories, f => f.type_code);
  const regionCounts = countBy(factories, f => f.region);
  const districtCounts = countBy(factories, f => groupKey(f.province, f.amphoe));
  const districtLabel = key => {
    const [province, amphoe] = key.split('|');
    return `${amphoe}, ${province}`;
  };
  const districtRegion = {};
  for (const f of factories) districtRegion[groupKey(f.province, f.amphoe)] = f.region;

  const hpBucketCounts = {};
  for (const f of factories) {
    if (typeof f.hp_registered !== 'number') continue;
    const bucket = HP_BUCKETS.find(([lo, hi]) => f.hp_registered >= lo && f.hp_registered < hi);
    if (bucket) hpBucketCounts[bucket[2]] = (hpBucketCounts[bucket[2]] || 0) + 1;
  }

  html += '<div class="analysis-sections">';
  html += renderBarChartCard(
    '10 จังหวัดที่มีโรงงานมากที่สุด',
    topEntries(provinceCounts, 10),
    province => {
      const feature = PROVINCES_GEOJSON.features.find(f => f.properties.pro_th === province);
      return regionColorFor(feature ? feature.properties.region : 'กลาง');
    }
  );
  html += renderBarChartCard(
    '10 อำเภอที่มีโรงงานมากที่สุด',
    topEntries(districtCounts, 10).map(([key, count]) => [districtLabel(key), count]),
    label => {
      const key = Object.keys(districtRegion).find(k => districtLabel(k) === label);
      return regionColorFor(key ? districtRegion[key] : 'กลาง');
    }
  );
  html += renderBarChartCard(
    '10 ประเภทโรงงานที่พบมากที่สุด',
    topEntries(typeCounts, 10),
    () => 'var(--primary)'
  );
  html += renderBarChartCard(
    'การกระจายตามช่วงแรงม้า',
    HP_BUCKETS.map(([, , label]) => [label, hpBucketCounts[label] || 0]).filter(([, c]) => c > 0),
    () => 'var(--primary)'
  );
  html += renderBarChartCard(
    'จำนวนโรงงานแยกตามภาค',
    REGION_ORDER.filter(r => regionCounts[r]).map(r => [REGION_LABELS[r], regionCounts[r]]),
    label => {
      const region = REGION_ORDER.find(r => REGION_LABELS[r] === label);
      return regionColorFor(region);
    }
  );
  html += '</div>';

  // A denser per-region table — count, total/average HP, and total
  // capital side by side, rather than just one number per region.
  html += '<div class="bar-chart-card" style="margin-top:20px;"><h3>สรุปตามภาค</h3>';
  html += '<table class="region-summary-table"><thead><tr>' +
    '<th>ภาค</th><th>จำนวนโรงงาน</th><th>แรงม้ารวม</th><th>แรงม้าเฉลี่ย</th><th>เงินทุนรวม (ล้านบาท)</th>' +
    '</tr></thead><tbody>';
  for (const region of REGION_ORDER) {
    if (!regionCounts[region]) continue;
    const inRegion = factories.filter(f => f.region === region);
    const hpSum = inRegion.reduce((sum, f) => sum + (typeof f.hp_registered === 'number' ? f.hp_registered : 0), 0);
    const hpCount = inRegion.filter(f => typeof f.hp_registered === 'number').length;
    const capitalSum = inRegion.reduce((sum, f) => sum + (typeof f.capital_total === 'number' ? f.capital_total : 0), 0);
    html += `<tr>` +
      `<td><span class="region-dot" style="background:${regionColorFor(region)}"></span>${escapeHtml(REGION_LABELS[region])}</td>` +
      `<td>${regionCounts[region].toLocaleString('th-TH')}</td>` +
      `<td>${hpSum.toLocaleString('th-TH')}</td>` +
      `<td>${hpCount ? Math.round(hpSum / hpCount).toLocaleString('th-TH') : '-'}</td>` +
      `<td>${(capitalSum / 1e6).toLocaleString('th-TH', { maximumFractionDigits: 1 })}</td>` +
      `</tr>`;
  }
  html += '</tbody></table></div>';

  el.innerHTML = html;
}

function groupKey(province, amphoe) {
  return province + '|' + amphoe;
}

// Searches จังหวัด/อำเภอ/ตำบล (province, district, sub-district) names
// together — a province or district match keeps the whole group, a
// sub-district-only match also auto-expands that group so the
// matching ตำบล is visible without an extra click.
function onTableLocationSearch(value) {
  tableLocationSearch = value;
  const input = document.getElementById('table-location-search');
  const caret = input ? input.selectionStart : null;
  renderTable(getFilteredFactories());
  const newInput = document.getElementById('table-location-search');
  if (newInput) {
    newInput.focus();
    if (caret !== null) newInput.setSelectionRange(caret, caret);
  }
}

function clearTableLocationSearch() {
  tableLocationSearch = '';
  renderTable(getFilteredFactories());
  const input = document.getElementById('table-location-search');
  if (input) input.focus();
}

function renderTable(factories) {
  // Seed every (province, amphoe) group from the full FACTORIES set, not
  // just the filtered one, so a district with zero matches still shows
  // a row (count 0) instead of disappearing from the table.
  const groups = {};
  for (const f of FACTORIES) {
    const key = groupKey(f.province, f.amphoe);
    if (!groups[key]) groups[key] = { province: f.province, amphoe: f.amphoe, factories: [] };
  }
  for (const f of factories) {
    const key = groupKey(f.province, f.amphoe);
    groups[key].factories.push(f);
  }

  let sortedKeys = Object.keys(groups).sort((a, b) => {
    const ga = groups[a], gb = groups[b];
    return ga.province.localeCompare(gb.province) || ga.amphoe.localeCompare(gb.amphoe);
  });

  const query = tableLocationSearch.trim();
  if (query) {
    sortedKeys = sortedKeys.filter(key => {
      const g = groups[key];
      if (g.province.includes(query) || g.amphoe.includes(query)) return true;
      return g.factories.some(f => f.tambon && f.tambon.includes(query));
    });
    for (const key of sortedKeys) {
      const g = groups[key];
      if (!g.province.includes(query) && !g.amphoe.includes(query)) {
        expandedGroups.add(key);
      }
    }
  }

  let html =
    `<div class="table-search-row">` +
    `<input type="text" id="table-location-search" value="${escapeHtml(tableLocationSearch)}" ` +
    `placeholder="ค้นหาจังหวัด/อำเภอ-เขต/ตำบล-แขวง" oninput="onTableLocationSearch(this.value)">` +
    `<button type="button" class="clear-btn" onclick="clearTableLocationSearch()">ล้างคำค้นหา</button>` +
    `</div>`;
  html += '<table><thead><tr><th>จังหวัด</th><th>อำเภอ</th><th>จำนวนโรงงาน</th></tr></thead><tbody>';
  if (sortedKeys.length === 0) {
    html += `<tr><td colspan="3" class="hint">ไม่พบจังหวัด/อำเภอ/ตำบลที่ตรงกับคำค้นหา</td></tr>`;
  }
  for (const key of sortedKeys) {
    const group = groups[key];
    html += `<tr class="group-row" onclick="toggleGroup('${key}')">` +
      `<td>${escapeHtml(group.province)}</td>` +
      `<td>${escapeHtml(group.amphoe)}</td>` +
      `<td>${group.factories.length}</td></tr>`;
    if (expandedGroups.has(key)) {
      html += `<tr><td colspan="3">${renderTambonBreakdown(group.factories)}</td></tr>`;
    }
  }
  html += '</tbody></table>';

  document.getElementById('table-view').innerHTML = html;
}

function renderTambonBreakdown(factories) {
  const byTambon = {};
  for (const f of factories) {
    const key = f.tambon || 'ไม่ระบุตำบล';
    if (!byTambon[key]) byTambon[key] = [];
    byTambon[key].push(f);
  }
  let html = '';
  for (const tambon of Object.keys(byTambon).sort()) {
    html += `<div class="tambon-block"><h4>ต.${escapeHtml(tambon)}</h4>`;
    for (const f of byTambon[tambon]) {
      const mapsUrl = googleMapsUrl(f);
      html += `<div><span class="fname" onclick="showFactoryDetail(${f.fid})">${escapeHtml(f.name)}</span>` +
        (mapsUrl ? `<a class="maps-pin" href="${mapsUrl}" target="_blank" rel="noopener" title="เปิดใน Google Maps">&#128205;</a>` : '') +
        ` &mdash; แรงม้า: ${escapeHtml(f.hp_registered)}</div>`;
    }
    html += '</div>';
  }
  return html;
}

function toggleGroup(key) {
  if (expandedGroups.has(key)) {
    expandedGroups.delete(key);
  } else {
    expandedGroups.add(key);
  }
  renderTable(getFilteredFactories());
}

populateTypeFilter();
renderMap(getFilteredFactories());
</script>
